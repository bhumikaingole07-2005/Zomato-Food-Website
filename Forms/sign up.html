<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="./image/zomatoicon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <style>
        /* ---------- Reset ---------- */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

/* ---------- Background Image ---------- */
.backimg {
    position: fixed;
    inset: 0;
    z-index: -1;
}

.backimg img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: brightness(0.6);
}

/* ---------- Container ---------- */
.container {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* ---------- Signup Card ---------- */
.signup-box {
    width: 400px;
    padding: 35px;
    background: rgba(255, 255, 255, 0.15);
    backdrop-filter: blur(12px);
    border-radius: 18px;
    box-shadow: 0 10px 35px rgba(0,0,0,0.35);
    color: #fff;
    text-align: center;
}

/* ---------- Title ---------- */
.signup-box h2 {
    font-size: 32px;
    margin-bottom: 5px;
}

.signup-box p {
    font-size: 15px;
    color: #ddd;
    margin-bottom: 25px;
}

/* ---------- Input Fields ---------- */
.input-box {
    position: relative;
    margin-bottom: 22px;
}

.input-box input {
    width: 100%;
    height: 45px;
    background: transparent;
    border: 1px solid rgba(255,255,255,0.5);
    border-radius: 25px;
    padding: 0 20px;
    color: #fff;
    font-size: 15px;
    outline: none;
}

.input-box label {
    position: absolute;
    top: 50%;
    left: 20px;
    transform: translateY(-50%);
    color: #ddd;
    font-size: 14px;
    pointer-events: none;
    transition: 0.3s ease;
}

/* Floating Label */
.input-box input:focus + label,
.input-box input:valid + label {
    top: -6px;
    background: rgba(0,0,0,0.6);
    padding: 0 8px;
    font-size: 12px;
    color: #ff4f5a;
}

/* ---------- Button ---------- */
button {
    width: 100%;
    height: 45px;
    border: none;
    border-radius: 25px;
    background: #ff4f5a;
    color: #fff;
    font-size: 18px;
    cursor: pointer;
    margin-top: 10px;
    transition: 0.3s;
}

button:hover {
    background: #e8434f;
}

/* ---------- Login Link ---------- */
.login-link {
    margin-top: 15px;
    font-size: 14px;
}

.login-link a {
    color: #ffb3b8;
    text-decoration: none;
}

.login-link a:hover {
    text-decoration: underline;
}

/* ---------- Responsive ---------- */
@media (max-width: 450px) {
    .signup-box {
        width: 90%;
    }
}

    </style>
</head>
<body>
<div class="backimg">
    <img src="./image/background image.avif">
</div>
<div class="container">
    <div class="signup-box">
        <h2>Create Account</h2>
        <p>Join us today</p>

        <form>
            <div class="input-box">
                <input type="text" required>
                <label>Full Name</label>
            </div>

            <div class="input-box">
                <input type="email" required>
                <label>Email Address</label>
            </div>

            <div class="input-box">
                <input type="password" required>
                <label>Password</label>
            </div>

            <div class="input-box">
                <input type="password" required>
                <label>Confirm Password</label>
            </div>

            <button type="submit">Sign Up</button>

            <div class="login-link">
                Already have an account? <a href="loginzomato.html">Login</a>
            </div>
        </form>
    </div>
</div>

</body>
</html>
