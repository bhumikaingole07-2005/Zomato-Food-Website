<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="./image/zomatoicon.png">
    <style>
        /* Reset */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', sans-serif;
}

/* Background Image */
.backimg {
    position: fixed;
    inset: 0;
    z-index: -1;
}

.backimg img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: brightness(0.6);
}

/* Container */
.container {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* Register Card */
.register-box {
    width: 420px;
    padding: 35px;
    background: rgba(255, 255, 255, 0.15);
    backdrop-filter: blur(12px);
    border-radius: 18px;
    box-shadow: 0 10px 35px rgba(0,0,0,0.35);
    color: #fff;
    text-align: center;
}

/* Heading */
.register-box h2 {
    font-size: 32px;
    margin-bottom: 5px;
}

.register-box p {
    font-size: 14px;
    color: #ddd;
    margin-bottom: 25px;
}

/* Inputs */
.input-box {
    position: relative;
    margin-bottom: 22px;
}

.input-box input {
    width: 100%;
    height: 45px;
    border-radius: 25px;
    border: 1px solid rgba(255,255,255,0.5);
    background: transparent;
    padding: 0 20px;
    color: #fff;
    outline: none;
}

.input-box label {
    position: absolute;
    top: 50%;
    left: 20px;
    transform: translateY(-50%);
    font-size: 14px;
    color: #ddd;
    pointer-events: none;
    transition: 0.3s;
}

/* Floating Label */
.input-box input:focus + label,
.input-box input:valid + label {
    top: -6px;
    font-size: 12px;
    padding: 0 8px;
    background: rgba(0,0,0,0.6);
    color: #ff4f5a;
}

/* Button */
button {
    width: 100%;
    height: 45px;
    border: none;
    border-radius: 25px;
    background: #ff4f5a;
    color: #fff;
    font-size: 18px;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    background: #e8434f;
}

/* Login Link */
.login-link {
    margin-top: 15px;
    font-size: 14px;
}

.login-link a {
    color: #ffb3b8;
    text-decoration: none;
}

.login-link a:hover {
    text-decoration: underline;
}

/* Responsive */
@media (max-width: 480px) {
    .register-box {
        width: 90%;
    }
}

    </style>
</head>

<body>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register</title>
    <link rel="stylesheet" href="register.css">
</head>
<body>

<div class="backimg">
    <img src="./image/background image.avif">
</div>

<div class="container">
    <div class="register-box">
        <h2>Create Account</h2>
        <p>Join us and explore food near you</p>

        <form>
            <div class="input-box">
                <input type="text" required>
                <label>Full Name</label>
            </div>

            <div class="input-box">
                <input type="email" required>
                <label>Email Address</label>
            </div>

            <div class="input-box">
                <input type="tel" required>
                <label>Phone Number</label>
            </div>

            <div class="input-box">
                <input type="password" required>
                <label>Password</label>
            </div>

            <div class="input-box">
                <input type="password" required>
                <label>Confirm Password</label>
            </div>

            <button type="submit">Register</button>

            <div class="login-link">
                Already have an account? <a href="loginzomato.html">Login</a>
            </div>
        </form>
    </div>
</div>

</body>
</html>



</body>
<script>
    
function validateRegister() {
    const name = document.getElementById("name").value.trim();
    const email = document.getElementById("email").value.trim();
    const phone = document.getElementById("phone").value.trim();
    const password = document.getElementById("password").value;
    const confirmPassword = document.getElementById("confirmPassword").value;
    const error = document.getElementById("errorMsg");

    // Clear error
    error.innerHTML = "";

    // Name validation
    if (name.length < 3) {
        error.innerHTML = "Name must be at least 3 characters";
        return false;
    }

    // Email validation
    if (!email.includes("@") || !email.includes(".")) {
        error.innerHTML = "Enter a valid email address";
        return false;
    }

    // Phone validation
    if (phone.length !== 10 || isNaN(phone)) {
        error.innerHTML = "Enter valid 10-digit phone number";
        return false;
    }

    // Password length
    if (password.length < 6) {
        error.innerHTML = "Password must be at least 6 characters";
        return false;
    }

    // Password match
    if (password !== confirmPassword) {
        error.innerHTML = "Passwords do not match";
        return false;
    }

    alert("Registration Successful!");
    return true;
}
</script>
</html>
